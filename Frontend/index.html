
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Transport Route Management System</title>
      <meta name="description" content="Streamline transport operations with a user-friendly route management system for employees and drivers, enhancing efficiency and communication." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <script>
        // Applied before React hydrates, so the page never flashes the wrong
        // theme on load — matches the read in ThemeContext.tsx exactly.
        try {
          var saved = localStorage.getItem('transpo-theme');
          if (saved === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      </script>

    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>

name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Production images always live on the upstream account. Forks still get a
# Docker build check on PRs; only a push to Saon110/main publishes + deploys.
env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/saon110/dders-backend
  FRONTEND_IMAGE: ghcr.io/saon110/dders-frontend

jobs:
  # ── CI: build-check on every push & PR ──────────────────────────────────────
  build:
    name: Build images (CI check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: dders-backend:ci

      - name: Build frontend (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: false
          build-args: VITE_API_BASE_URL=/api
          tags: dders-frontend:ci

  # ── CD: push images + deploy (main branch only) ─────────────────────────────
  deploy:
    name: Push & deploy to Azure VM
    needs: build
    if: github.repository == 'Saon110/Data-Driven-Employee-Routing-System' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          build-args: VITE_API_BASE_URL=/api
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The next step's tar extraction can overwrite a file's *contents* using
      # only directory write permission, but chmod/utime on an existing file
      # requires actually owning that file (or root) — directory permissions
      # alone don't grant that. If /opt/dders/docker-compose.yml was ever
      # created by root (e.g. an earlier `sudo scp`/`sudo mkdir` bootstrap),
      # every later scp fails with:
      #   "Cannot utime: Operation not permitted"
      #   "Cannot change mode to rw-r--r--: Operation not permitted"
      # even with scp-action's overwrite:true — that flag only stops tar from
      # refusing an existing file, it can't bypass the file-owner check.
      # Reasserting ownership before every copy makes this self-healing
      # regardless of how the directory got into a bad state.
      - name: Ensure remote directory is owned by the deploy user
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            set -e
            sudo mkdir -p /opt/dders
            sudo chown -R "$(whoami):$(whoami)" /opt/dders

      - name: Copy compose file to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          source: docker-compose.yml
          target: /opt/dders/
          # Without this, the remote tar extraction refuses to replace a file
          # that already exists at the target — and docker-compose.yml always
          # already exists there from the previous deploy, so every run after
          # the first would fail here deterministically.
          overwrite: true

      - name: Deploy on Azure VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          # Overall wall-clock budget for the whole script below. Without this,
          # a stalled `docker compose pull` can hang the step — and the job —
          # forever, silently burning Actions minutes instead of failing
          # loudly. Must exceed the inner retry budget (2 x 15m) plus the
          # `compose up` that follows, or it would cut a healthy pull short.
          command_timeout: 40m
          script: |
            set -e
            cd /opt/dders

            # Reclaim superseded layers on EVERY exit path, not just the happy
            # one: with `set -e`, a failed pull skipped the prune entirely, so
            # dangling images from half-finished deploys accumulated on the VM.
            trap 'docker image prune -f || true' EXIT

            # Log in so Docker can pull the (potentially private) GHCR packages
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Bound the pull so a genuine stall fails loudly instead of hanging
            # the job — but bound it GENEROUSLY. The backend image is ~2 GB, so
            # a cold pull (any build where the dependency layer was rebuilt and
            # got a new digest) legitimately needs many minutes. A cap that is
            # too tight is actively harmful: `timeout` kills the pull mid-
            # transfer, which has been observed to leave the VM's Docker daemon
            # holding stale download state and then hanging on that same layer
            # forever, until `systemctl restart docker` clears it. Prefer few,
            # long attempts over many short ones.
            pull_ok=false
            for attempt in 1 2; do
              echo "docker compose pull — attempt $attempt/2"
              if timeout 900 docker compose pull; then
                pull_ok=true
                break
              fi
              echo "Attempt $attempt timed out or failed; retrying in 10s..."
              sleep 10
            done
            if [ "$pull_ok" != "true" ]; then
              echo "::error::docker compose pull failed after 2 attempts — if the"
              echo "::error::VM's daemon is wedged, run: sudo systemctl restart docker"
              exit 1
            fi

            docker compose up -d --remove-orphans

            echo "✅ Deployed at $(date -u) — sha ${{ github.sha }}"
